# Event-family mapping: collapse source-native event types into coarser
# families so recurrence can be detected across slightly different labels
# at the same entity. Used when --match-level=family.
#
# Pattern: map[source][family_name] -> list of case-insensitive substring
# patterns that match the source-native event_type string.

osha_sir:
  fall:
    - fall
    - slip
  struck_by:
    - struck by
    - struck-by
    - contact with
  caught_in:
    - caught in
    - caught-in
    - caught between
    - pinch
    - crush
  overexertion:
    - overexertion
    - lifting
    - pushing
    - pulling
  cut_pierce:
    - cut
    - laceration
    - knife
    - blade
  fire_explosion:
    - fire
    - explosion
    - burn
  exposure:
    - exposure
    - inhalation
    - ingestion
  transport:
    - vehicle
    - forklift
    - truck
    - motor

