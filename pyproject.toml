[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-of-failure"
version = "0.1.0"
description = "UVA MSBA capstone: does the linguistic quality of safety incident narratives predict recurrence?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UVA MSBA Capstone" }]

dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
analysis = [
    "rapidfuzz>=3.6",
    "spacy>=3.7",
    "textstat>=0.7",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "PyYAML>=6.0",
]
embeddings = [
    "sentence-transformers>=2.5",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["scripts", "normalize", "labels", "features", "models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter
